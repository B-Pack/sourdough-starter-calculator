
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourdough Starter Calculator V3</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--accent:#6f7759;--text:#333;--border:#ddd;--calc:#e8efe0}
[data-theme="dark"]{--bg:#1f1f1f;--card:#2b2b2b;--accent:#7e8865;--text:#f0f0f0;--border:#444;--calc:#43503b}
*{box-sizing:border-box} body{margin:0;padding:16px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.theme-btn,.clear-btn{border:none;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}
.theme-btn{background:var(--accent);color:#fff}.clear-btn{background:#b94a48;color:#fff;width:100%;margin-top:12px}
.tabs{display:flex;gap:6px;margin:16px 0}.tab{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer}.active{background:var(--accent);color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:768px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:bold;margin-top:10px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
.results{background:rgba(111,119,89,.08);padding:16px;border-radius:12px}.row{display:flex;justify-content:space-between;padding:5px 0}
.hidden{display:none}.calculated{opacity:.55}.calculated input{background:var(--calc);font-weight:bold}.badge{font-size:.75rem;color:var(--accent)}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="header"><h1>🍞 Sourdough Starter Calculator</h1><button id="themeToggle" class="theme-btn">🌙 Dark Mode</button></div>
<p id="hint">Calculate the feeding ratio required based on your existing starter amount.</p>
<div class="tabs">
<button class="tab active" onclick="setMode(1)">Initial Starter</button>
<button class="tab" onclick="setMode(2)">Feed Ratio</button>
<button class="tab" onclick="setMode(3)">Smart Custom</button>
</div>
<div class="grid"><div>
<div id="xWrap"><label>Current Starter (g) <span id="xBadge" class="badge"></span></label><input id="x" type="number"></div>
<div id="aWrap" class="hidden"><label>Feed Ratio (1:A:A) <span id="aBadge" class="badge"></span></label><input id="a" type="number" step="0.01"></div>
<div id="rWrap"><label>Recipe Requirement (g) <span id="rBadge" class="badge"></span></label><input id="rsy" type="number"></div>
<label>Starter Reserve / Buffer (g)</label><input id="reserve" type="number" placeholder="Blank = Auto (3.5% or 30g minimum)">
<button class="clear-btn" onclick="clearCalculator()">🧹 Clear Calculator</button>
<p id="ratio"><strong>Ratio:</strong> —</p>
</div><div>
<div class="results">
<h3>What You Need</h3>
<div class="row"><span>Recipe Requirement</span><strong id="outReq">—</strong></div>
<div class="row"><span>Starter Reserve</span><strong id="outReserve">—</strong></div>
<div class="row"><span>Total Yield Needed</span><strong id="outTotal">—</strong></div><hr>
<h3>What You Feed</h3>
<div class="row"><span>Starter</span><strong id="outX">—</strong></div>
<div class="row"><span>Water</span><strong id="outY">—</strong></div>
<div class="row"><span>Flour</span><strong id="outZ">—</strong></div>
</div></div></div>
</div></div>
<script>
let mode=1;const ids=['x','a','rsy','reserve'];
ids.forEach(id=>{let e=document.getElementById(id);let v=localStorage.getItem(id);if(v)e.value=v;e.addEventListener('input',()=>{localStorage.setItem(id,e.value);calculate();});});
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===m-1));xWrap.classList.remove('hidden');aWrap.classList.add('hidden');
const hints={1:'Calculate the feeding ratio required based on your existing starter amount.',2:'Calculate how much starter is needed based on your desired feeding ratio.',3:'Enter any two values and the calculator automatically solves the third.'};
hint.textContent=hints[m]; if(m===2){xWrap.classList.add('hidden');aWrap.classList.remove('hidden');} if(m===3){aWrap.classList.remove('hidden');} clearCalculatedUI(); calculate();}
function clearCalculatedUI(){['x','a','rsy'].forEach(id=>{document.getElementById(id+'Wrap')?.classList.remove('calculated');});xBadge.textContent='';aBadge.textContent='';rBadge.textContent='';}
function fmt(v){return Number(v).toFixed(1)+'g'}; function val(id){return parseFloat(document.getElementById(id).value)}
function markCalculated(field){clearCalculatedUI(); const wrap=document.getElementById(field+'Wrap'); if(wrap) wrap.classList.add('calculated'); document.getElementById(field.charAt(0)+'Badge'); if(field==='x')xBadge.textContent='AUTO'; if(field==='a')aBadge.textContent='AUTO'; if(field==='rsy')rBadge.textContent='AUTO';}
function calculate(){let X=val('x'),A=val('a'),R=val('rsy'),reserve=val('reserve'); if(isNaN(reserve)&&!isNaN(R)) reserve=Math.max(R*0.035,30); let total,Y;
if(mode===1 && X>0 && R>0){total=R+reserve;A=(total-X)/(2*X);Y=A*X;}
else if(mode===2 && A>0 && R>0){total=R+reserve;X=total/(1+2*A);Y=A*X;}
else if(mode===3){const hasX=X>0,hasA=A>0,hasR=R>0; reserve=isNaN(reserve)?30:reserve; if(hasX&&hasA&&!hasR){total=X*(1+2*A);R=total-reserve;Y=A*X;markCalculated('rsy');}
else if(hasX&&hasR&&!hasA){total=R+reserve;A=(total-X)/(2*X);Y=A*X;markCalculated('a');}
else if(hasA&&hasR&&!hasX){total=R+reserve;X=total/(1+2*A);Y=A*X;markCalculated('x');}
else return;} else return;
outReq.textContent=fmt(R);outReserve.textContent=fmt(reserve);outTotal.textContent=fmt((R+reserve));outX.textContent=fmt(X);outY.textContent=fmt(Y);outZ.textContent=fmt(Y);ratio.innerHTML='<strong>Ratio:</strong> 1 : '+A.toFixed(2)+' : '+A.toFixed(2);}
function clearCalculator(){ids.forEach(id=>{document.getElementById(id).value='';localStorage.removeItem(id)});clearCalculatedUI();['outReq','outReserve','outTotal','outX','outY','outZ'].forEach(id=>document.getElementById(id).textContent='—');ratio.innerHTML='<strong>Ratio:</strong> —';}
function updateTheme(){let d=document.documentElement.getAttribute('data-theme')==='dark';themeToggle.textContent=d?'☀️ Light Mode':'🌙 Dark Mode';}
themeToggle.onclick=()=>{let d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('theme',d?'light':'dark');updateTheme();};
document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');updateTheme();setMode(1);
</script></body></html>
