
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourdough Starter Calculator</title>

  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --accent: #6f7759;
      --text: #333333;
      --border: #dddddd;
    }

    [data-theme="dark"] {
      --bg: #1f1f1f;
      --card: #2b2b2b;
      --accent: #7e8865;
      --text: #f0f0f0;
      --border: #444444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container { max-width: 1000px; margin: auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .theme-btn, .clear-btn {
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .theme-btn { background: var(--accent); color: white; }
    .clear-btn { background: #b94a48; color: white; width: 100%; margin-top: 12px; }

    .tabs {
      display: flex;
      gap: 6px;
      margin: 16px 0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ddd;
    }

    .tab.active {
      background: var(--accent);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media(max-width:768px){ .grid{ grid-template-columns:1fr; } }

    label {
      display:block;
      margin:10px 0 4px;
      font-weight:bold;
    }

    input {
      width:100%;
      padding:12px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--card);
      color:var(--text);
    }

    .results {
      background: rgba(111,119,89,.08);
      border-radius: 12px;
      padding: 16px;
    }

    .row { display:flex; justify-content:space-between; padding:6px 0; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">

    <div class="header-row">
      <h1>🍞 Sourdough Starter Calculator</h1>
      <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>

    <p id="hint">I know how much starter I have.</p>

    <div class="tabs">
      <button class="tab active" onclick="setMode(1)">Initial Starter</button>
      <button class="tab" onclick="setMode(2)">Feed Ratio</button>
      <button class="tab" onclick="setMode(3)">Smart Custom</button>
    </div>

    <div class="grid">
      <div>
        <div id="xWrap">
          <label>Current Starter (g)</label>
          <input id="x" type="number">
        </div>

        <div id="aWrap" class="hidden">
          <label>Feed Ratio A (1:A:A)</label>
          <input id="a" type="number" step="0.01">
        </div>

        <label>Recipe Requirement (g)</label>
        <input id="rsy" type="number">

        <label>Starter Reserve / Buffer (g)</label>
        <input id="reserve" type="number" placeholder="Blank = Auto">

        <button class="clear-btn" onclick="clearCalculator()">🧹 Clear Calculator</button>

        <p id="ratio"><strong>Ratio:</strong> —</p>
      </div>

      <div>
        <div class="results">
          <h3>What You Need</h3>
          <div class="row"><span>Recipe Requirement</span><strong id="outReq">—</strong></div>
          <div class="row"><span>Starter Reserve</span><strong id="outReserve">—</strong></div>
          <div class="row"><span>Total Yield Needed</span><strong id="outTotal">—</strong></div>
          <hr>
          <h3>What You Feed</h3>
          <div class="row"><span>Starter</span><strong id="outX">—</strong></div>
          <div class="row"><span>Water</span><strong id="outY">—</strong></div>
          <div class="row"><span>Flour</span><strong id="outZ">—</strong></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let mode = 1;
const ids=['x','a','rsy','reserve'];

ids.forEach(id=>{
 const el=document.getElementById(id);
 const saved=localStorage.getItem(id);
 if(saved) el.value=saved;
 el.addEventListener('input',()=>{
   localStorage.setItem(id,el.value);
   calculate();
 });
});

function setMode(m){
 mode=m;
 document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===m-1));
 document.getElementById('xWrap').classList.remove('hidden');
 document.getElementById('aWrap').classList.add('hidden');
 if(m===2){document.getElementById('xWrap').classList.add('hidden');document.getElementById('aWrap').classList.remove('hidden');}
 if(m===3){document.getElementById('aWrap').classList.remove('hidden');}
 calculate();
}

function clearCalculator(){
 ids.forEach(id=>{document.getElementById(id).value='';localStorage.removeItem(id);});
 ['outReq','outReserve','outTotal','outX','outY','outZ'].forEach(id=>document.getElementById(id).textContent='—');
 document.getElementById('ratio').innerHTML='<strong>Ratio:</strong> —';
}

function fmt(v){return Number(v).toFixed(1)+'g';}
function val(id){return parseFloat(document.getElementById(id).value);}

function calculate(){
 let X=val('x'),A=val('a'),R=val('rsy'),reserve=val('reserve');
 if(isNaN(reserve)&&!isNaN(R)) reserve=Math.max(R*0.035,30);
 let total,Y;
 if(mode===1 && X>0 && R>0){total=R+reserve;A=(total-X)/(2*X);Y=A*X;}
 else if(mode===2 && A>0 && R>0){total=R+reserve;X=total/(1+2*A);Y=A*X;}
 else return;
 document.getElementById('outReq').textContent=fmt(R);
 document.getElementById('outReserve').textContent=fmt(reserve);
 document.getElementById('outTotal').textContent=fmt(total);
 document.getElementById('outX').textContent=fmt(X);
 document.getElementById('outY').textContent=fmt(Y);
 document.getElementById('outZ').textContent=fmt(Y);
 document.getElementById('ratio').innerHTML='<strong>Ratio:</strong> 1 : '+A.toFixed(2)+' : '+A.toFixed(2);
}

function updateThemeButton(){
 const dark=document.documentElement.getAttribute('data-theme')==='dark';
 document.getElementById('themeToggle').textContent=dark?'☀️ Light Mode':'🌙 Dark Mode';
}

function toggleTheme(){
 const dark=document.documentElement.getAttribute('data-theme')==='dark';
 document.documentElement.setAttribute('data-theme',dark?'light':'dark');
 localStorage.setItem('theme',dark?'light':'dark');
 updateThemeButton();
}

document.getElementById('themeToggle').addEventListener('click',toggleTheme);
const savedTheme=localStorage.getItem('theme')||'light';
document.documentElement.setAttribute('data-theme',savedTheme);
updateThemeButton();
</script>
</body>
</html>
